<title>All Engineering Jobs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column — header, sticky filter bar, then a dense list of postings (grid rows that stack on phones). */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #121821; --muted: #5a6574; --line: #dbe0e7;
  --accent: #2350d1; --accent-soft: #e6ecfb; --exact: #0b7a62; --exact-soft: #e1f3ee; --warn: #9a5b00;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c25; --ink: #e5eaf0; --muted: #94a1b0; --line: #26313d;
  --accent: #86a6ff; --accent-soft: #1c2a4d; --exact: #52cba8; --exact-soft: #143a31; --warn: #e2a64a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c25; --ink: #e5eaf0; --muted: #94a1b0; --line: #26313d;
  --accent: #86a6ff; --accent-soft: #1c2a4d; --exact: #52cba8; --exact-soft: #143a31; --warn: #e2a64a; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 32px 20px; display: grid; gap: 10px; }
h1 { font: 700 clamp(28px, 4.5vw, 40px)/1.1 var(--display); letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 70ch; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 4px 0 0; font: 13px/1.4 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 500; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.search { flex: 1 1 260px; min-width: 0; }
.search input { width: 100%; box-sizing: border-box; font: 15px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.search input:focus-visible, select:focus-visible, .seg button:focus-visible, .more:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 13px var(--body); color: var(--muted); background: none; border: 0; padding: 8px 11px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
select { font: 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; text-transform: none; letter-spacing: 0; }
.count { margin: 10px 0 0; font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.list { list-style: none; margin: 0; padding: 0 0 8px; }
.row { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.5fr) minmax(0, 1fr) 92px 104px 32px; gap: 4px 18px; align-items: baseline; padding: 13px 0; border-bottom: 1px solid var(--line); }
.head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); padding-block: 14px 8px; }
.title { min-width: 0; }
.title a { color: var(--ink); font-weight: 600; text-decoration: none; }
.title a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.co { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; }
.chip { font: 500 11px/1 var(--body); padding: 4px 7px; border-radius: 5px; white-space: nowrap; letter-spacing: 0.02em; }
.chip.exact { background: var(--exact-soft); color: var(--exact); }
.chip.lvl { border: 1px solid var(--line); color: var(--muted); }
.fit { font: 600 12px/1 var(--mono); padding: 4px 7px; border-radius: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fit.hi { background: var(--exact-soft); color: var(--exact); } .fit.mid { background: var(--accent-soft); color: var(--accent); } .fit.lo { border: 1px solid var(--line); color: var(--muted); }
.why { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.why b { font-weight: 500; color: var(--warn); }
.chip.unk { border: 1px dashed var(--warn); color: var(--warn); }
.loc { color: var(--ink); font-size: 14px; overflow-wrap: anywhere; min-width: 0; }
.loc .rm { color: var(--exact); font-weight: 500; }
.pay { font: 13px var(--mono); color: var(--ink); overflow-wrap: anywhere; min-width: 0; }
.pay.none { color: var(--muted); }
.date { font: 13px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.date small { display: block; color: var(--muted); font-size: 12px; }
.src { font: 12px var(--mono); color: var(--muted); }
.x { width: 32px; height: 32px; display: grid; place-items: center; justify-self: end; align-self: start; margin-top: -5px; padding: 0; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
.x svg { width: 15px; height: 15px; }
.x:hover { color: var(--ink); background: var(--surface); border-color: var(--line); }
.x:focus-visible, .linkbtn:focus-visible, .toast button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.linkbtn { font: 500 13px var(--body); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.sync { font: 12px var(--body); color: var(--muted); }
.viewing { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 14px; }
.toast { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: min(560px, calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  display: flex; align-items: center; gap: 14px; padding: 11px 14px 11px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; box-shadow: 0 6px 24px rgb(0 0 0 / 0.22); }
.toast span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast button { flex: none; font: 600 14px var(--body); color: var(--bg); background: none; border: 1px solid currentColor; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }
.more { display: block; margin: 18px auto 40px; font: 500 14px var(--body); color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 18px; cursor: pointer; }
footer { padding-block: 8px 40px; color: var(--muted); font-size: 13px; max-width: 80ch; }

@media (max-width: 760px) {
  .bar { position: static; }
  .head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
  .title { grid-column: 1; grid-row: 1; }
  .x { grid-column: 2; grid-row: 1; margin-top: -4px; }
  .loc { grid-column: 1 / -1; color: var(--muted); }
  .pay { grid-column: 1 / -1; }
  .date small { display: inline; margin-left: 6px; }
  .src { text-align: right; }
}
@media (prefers-reduced-motion: no-preference) { .title a, .seg button { transition: color .12s, background-color .12s; } }
</style>

<header class="wrap">
  <h1>All Engineering Jobs</h1>
  <p class="lede">Every open software, data, ML, platform and infrastructure role in the US, read each morning from company job boards and career sites. No pay or level filter.</p>
  <p class="stats" id="stats"></p>
</header>

<div class="bar">
  <div class="wrap">
    <div class="controls">
      <label class="search" for="q"><input id="q" type="search" placeholder="Filter by title, company, or city" autocomplete="off"></label>
      <div class="seg" role="group" aria-label="Location" id="where">
        <button type="button" data-v="nyc" aria-pressed="true">New York</button>
        <button type="button" data-v="chi" aria-pressed="false">Chicago</button>
        <button type="button" data-v="remote" aria-pressed="false">Remote</button>
        <button type="button" data-v="all" aria-pressed="false">All US</button>
      </div>
      <label class="field" for="age">Posted
        <select id="age">
          <option value="1">Last 24 hours</option>
          <option value="3">Last 3 days</option>
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30">Last 30 days</option>
          <option value="any">Any, incl. no date</option>
        </select>
      </label>
      <label class="field" for="src">Source
        <select id="src"><option value="all">All</option></select>
      </label>
      <label class="field" for="fit">Fit
        <select id="fit">
          <option value="0">Any</option>
          <option value="60">60%+</option>
          <option value="70">70%+</option>
          <option value="80">80%+</option>
        </select>
      </label>
      <label class="field" for="lvl">Level
        <select id="lvl">
          <option value="all">All</option>
          <option value="Intern">Intern</option>
          <option value="Entry">Entry</option>
          <option value="Mid / unspecified">Mid / unspecified</option>
          <option value="Senior+">Senior and up</option>
          <option value="early">Everything but senior</option>
        </select>
      </label>
      <label class="field" for="sort">Sort
        <select id="sort">
          <option value="new">Newest</option>
          <option value="fit">Best fit</option>
          <option value="co">Company</option>
          <option value="pay">Has pay first</option>
        </select>
      </label>
    </div>
    <div class="count"><span id="count"></span><button class="linkbtn" id="toggleHidden" type="button" hidden></button><span class="sync" id="sync"></span></div>
  </div>
</div>

<main class="wrap">
  <p class="viewing" id="viewing" hidden>You're looking at the jobs you hid. Press ↺ to put one back in the list.</p>
  <div class="row head" aria-hidden="true"><span>Role</span><span>Location</span><span>Pay (as posted)</span><span>Posted</span><span>Source</span><span></span></div>
  <ul class="list" id="list"></ul>
  <button class="more" id="more" type="button" hidden>Show more</button>
</main>

<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="undo">Undo</button></div>

<footer class="wrap" id="foot"></footer>

<script>
let DATA = { meta: { generated: "", sources: {} }, jobs: [] };
const PAGE = 200;
const $ = id => document.getElementById(id);
const state = { q: '', locs: ['nyc'], age: '7', src: 'all', fit: '0', lvl: 'all', sort: 'new', shown: PAGE };
try { Object.assign(state, JSON.parse(localStorage.getItem('aj-filters-v2') || '{}'), { shown: PAGE }); } catch (e) {}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let today = new Date();
function ago(d) {
  if (!d) return '';
  const n = Math.round((today - new Date(d + 'T00:00:00Z')) / 864e5);
  return n <= 0 ? 'today' : n === 1 ? '1 day ago' : n < 60 ? n + ' days ago' : Math.round(n / 30) + ' mo ago';
}
const fmt = n => n.toLocaleString('en-US');
function header() {
  const m = DATA.meta;
  if (!m.generated) return;
  today = new Date(m.generated.slice(0, 10) + 'T00:00:00Z');
  const when = new Date(m.generated).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  $('stats').innerHTML = `<span><b>${fmt(m.total)}</b> open roles</span><span><b>${fmt(m.nyc)}</b> in New York</span><span><b>${fmt(m.companies)}</b> companies</span><span>updated <b>${esc(when)}</b></span>`;
  const by = {}; DATA.jobs.forEach(j => by[j.s] = (by[j.s] || 0) + 1);
  const names = Object.keys(by).sort((a, b) => by[b] - by[a]);
  $('src').innerHTML = '<option value="all">All</option>' + names.map(n => `<option value="${esc(n)}">${esc(n)} (${fmt(by[n])})</option>`).join('');
  $('src').value = names.includes(state.src) ? state.src : (state.src = 'all');
  const failed = Object.entries(m.sources || {}).filter(([, v]) => /FAILED/.test(v.note || '') || !v.jobs).map(([k]) => k);
  $('foot').textContent = `Roles posted in the last ${m.days} days. Sources today: ${names.map(n => n + ' ' + fmt(by[n])).join(', ')}.` + (failed.length ? ` Returned nothing today: ${failed.join(', ')}.` : '') + ' Rows tagged “no date” come from sources that do not publish a posting date, so they only show under “Any”. Fit compares each role with your resume: role type, skills named in the description, years asked, location and pay. Because you have under 3 years of experience, senior titles and roles asking 5+ years are capped at 55%, and staff, principal, lead or 7+ year roles at 40%. A “~” means the source gave no description, so only the title and location were scored. Level is guessed from the title. Open the posting to confirm it is still live.';
}

function setSeg(id, key) {
  const g = $(id);
  g.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[key])));
  g.onclick = e => { const b = e.target.closest('button'); if (!b) return; state[key] = b.dataset.v; state.shown = PAGE; save(); setSeg(id, key); render(); };
}
function save() { try { const { shown, ...keep } = state; localStorage.setItem('aj-filters-v2', JSON.stringify(keep)); } catch (e) {} }

// ---- hidden jobs: saved to the viewer's private db subtree when the page can reach it, else this browser ----
const CACHE = 'aj-hidden-cache', LOCAL = 'aj-hidden-local';
const readSet = k => { try { return new Set(JSON.parse(localStorage.getItem(k) || '[]')); } catch (e) { return new Set(); } };
const writeSet = (k, s) => { try { localStorage.setItem(k, JSON.stringify([...s])); } catch (e) {} };
let hidden = new Set([...readSet(CACHE), ...readSet(LOCAL)]);   // cache avoids a flash before the account copy loads
let store = null, stopSync = null;
const chains = new Map();
let viewHidden = false;

function setSync(text) { $('sync').textContent = text; }
function useBrowser(note) {
  if (stopSync) { stopSync(); stopSync = null; }
  store = null;
  writeSet(LOCAL, hidden);
  setSync(note);
}
function persist(h, on) {
  writeSet(CACHE, hidden);
  if (!store) { const s = readSet(LOCAL); on ? s.add(h) : s.delete(h); writeSet(LOCAL, s); return; }
  const ref = store.doc('h-' + h);
  const write = () => on ? ref.set({ hiddenAt: new Date().toISOString() }) : ref.delete();
  const next = (chains.get(h) || Promise.resolve())   // one write at a time per job, so Undo lands after the hide
    .then(write)
    .catch(e => e && e.code === 'unavailable'
      ? new Promise(r => setTimeout(r, 600 + Math.random() * 600)).then(write)
      : Promise.reject(e))
    .catch(() => useBrowser('Could not save to your account, so hidden jobs are kept in this browser.'));
  chains.set(h, next);
}

(async () => {
  const c = window.claude;
  if (!c || !c.use) { setSync('Hidden jobs are saved in this browser.'); return; }
  const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) { setSync('Hidden jobs are saved in this browser.'); return; }
  const col = db.collection('data/users/' + uid);
  let first = true;
  stopSync = col.onSnapshot(snap => {
    const ids = new Set(snap.docs.filter(d => d.id.startsWith('h-')).map(d => d.id.slice(2)));
    if (first) {
      first = false; store = col;
      setSync('Hidden jobs sync to your account.');
      const pending = readSet(LOCAL);   // hides made while the account copy was out of reach
      try { localStorage.removeItem(LOCAL); } catch (e) {}
      for (const h of pending) if (!ids.has(h)) { ids.add(h); hidden = ids; persist(h, true); }
    }
    hidden = ids;
    writeSet(CACHE, hidden);
    render();
  }, () => useBrowser('Lost the connection to your account, so hidden jobs are kept in this browser.'));
})().catch(() => setSync('Hidden jobs are saved in this browser.'));

let toastTimer, lastHidden = null;
function showToast(j) {
  lastHidden = j;
  $('toastMsg').textContent = `Hid “${j.t}” at ${j.c}`;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; lastHidden = null; }, 7000);
}
$('undo').addEventListener('click', () => {
  if (!lastHidden) return;
  const j = lastHidden; lastHidden = null;
  hidden.delete(j.h); persist(j.h, false);
  $('toast').hidden = true; clearTimeout(toastTimer);
  render();
});

function toggle(h, btn) {
  const j = DATA.jobs.find(x => x.h === h); if (!j) return;
  const rows = [...$('list').querySelectorAll('.x')];
  const at = rows.indexOf(btn);
  const on = !hidden.has(h);
  on ? hidden.add(h) : hidden.delete(h);
  persist(h, on);
  render();
  if (on && !viewHidden) showToast(j);
  const after = $('list').querySelectorAll('.x');   // keep keyboard focus on the row that moved up
  (after[at] || after[after.length - 1] || $('q')).focus({ preventScroll: true });
}
$('list').addEventListener('click', e => { const b = e.target.closest('.x'); if (b) toggle(b.dataset.h, b); });
$('toggleHidden').addEventListener('click', () => { viewHidden = !viewHidden; state.shown = PAGE; render(); });

function filtered() {
  const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit = j => !words.length || words.every(w => (j.t + ' ' + j.c + ' ' + j.l + ' ' + j.s).toLowerCase().includes(w));
  if (viewHidden) return DATA.jobs.filter(j => hidden.has(j.h) && hit(j));
  const cut = state.age === 'any' ? null : new Date(today - (Number(state.age) - 1) * 864e5).toISOString().slice(0, 10);
  let out = DATA.jobs.filter(j =>
    !hidden.has(j.h) &&
    (!state.locs.length || (state.locs.includes('nyc') && j.n) || (state.locs.includes('chi') && j.ch) || (state.locs.includes('remote') && j.r)) &&
    (cut === null || (j.d && j.d >= cut)) &&
    (state.src === 'all' || j.s === state.src) &&
    (j.f || 0) >= Number(state.fit) &&
    (state.lvl === 'all' || (state.lvl === 'early' ? j.v !== 'Senior+' : j.v === state.lvl)) &&
    hit(j));
  const byNew = (a, b) => (b.d || '').localeCompare(a.d || '');
  if (state.sort === 'co') out.sort((a, b) => a.c.localeCompare(b.c, 'en', { sensitivity: 'base' }) || byNew(a, b));
  else if (state.sort === 'pay') out.sort((a, b) => (!!b.p - !!a.p) || byNew(a, b));
  else if (state.sort === 'fit') out.sort((a, b) => (b.fd - a.fd) || (b.f - a.f) || byNew(a, b));
  else out.sort(byNew);
  return out;
}

function fitChip(j) {
  if (j.f == null) return '';
  const cls = j.f >= 75 ? 'hi' : j.f >= 60 ? 'mid' : 'lo';
  return `<span class="fit ${cls}" title="${j.fd ? 'Scored against the full job description' : 'Scored on title and location only; this source gives no description'}">${j.fd ? '' : '~'}${j.f}% fit</span>`;
}
function why(j) {
  if (!j.fd) return j.v === 'Senior+' ? '<span class="why"><b>senior-level title</b></span>' : '';
  const parts = [];
  if (j.v === 'Senior+') parts.push('<b>senior-level title</b>');
  if (j.y) parts.push(j.y > 3 ? `<b>asks ${j.y}+ yrs</b>` : `asks ${j.y}+ yrs`);
  if (j.m) parts.push('match: ' + esc(j.m));
  if (j.g) parts.push('<b>not on your resume: ' + esc(j.g) + '</b>');
  return parts.length ? `<span class="why">${parts.join(' · ')}</span>` : '';
}
function row(j) {
  const loc = j.l ? esc(j.l).replace(/\b(remote)\b/i, '<span class="rm">$1</span>') : '<span class="pay none">not listed</span>';
  return `<li class="row">
    <div class="title"><a href="${esc(j.u)}" target="_blank" rel="noopener">${esc(j.t)}</a>
      <div class="co">${fitChip(j)}<span>${esc(j.c)}</span><span class="chip lvl">${esc(j.v)}</span>${j.k ? '' : '<span class="chip unk" title="This source does not publish a posting date.">no date</span>'}${why(j)}</div></div>
    <div class="loc">${loc}</div>
    <div class="pay${j.p ? '' : ' none'}">${j.p ? esc(j.p) : 'not posted'}</div>
    <div class="date">${j.d ? esc(j.d) + '<small>' + ago(j.d) + '</small>' : '<span class="pay none">no date</span>'}</div>
    <div class="src">${esc(j.s)}</div>
    ${viewHidden
      ? `<button class="x" type="button" data-h="${j.h}" title="Put back in the list" aria-label="Unhide ${esc(j.t)} at ${esc(j.c)}">${ICON_BACK}</button>`
      : `<button class="x" type="button" data-h="${j.h}" title="Hide this job" aria-label="Hide ${esc(j.t)} at ${esc(j.c)}">${ICON_X}</button>`}</li>`;
}
const ICON_X = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
const ICON_BACK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5a5 5 0 1 1 1.4 4"/><path d="M3 3.5v4h4"/></svg>';

function render() {
  const all = filtered();
  const list = $('list');
  list.innerHTML = all.length ? all.slice(0, state.shown).map(row).join('')
    : `<li class="empty">${viewHidden ? 'No hidden jobs here.' : 'No roles match these filters. Widen the Posted window or add a location.'}</li>`;
  $('count').textContent = viewHidden ? `${fmt(all.length)} hidden` : `${fmt(all.length)} shown of ${fmt(DATA.jobs.length)}` + (hidden.size ? ` · ${fmt(hidden.size)} hidden` : '');
  const tb = $('toggleHidden');
  tb.hidden = !viewHidden && hidden.size === 0;
  tb.textContent = viewHidden ? 'Back to all jobs' : 'Show hidden';
  $('viewing').hidden = !viewHidden;
  const left = all.length - state.shown;
  $('more').hidden = left <= 0;
  $('more').textContent = `Show ${fmt(Math.min(PAGE, left))} more (${fmt(left)} left)`;
}

$('q').value = state.q;
$('lvl').value = state.lvl;
$('sort').value = state.sort;
// Location: pick any mix of New York, Chicago and Remote; "All US" clears the picks.
function setLocs() {
  if (!Array.isArray(state.locs)) state.locs = ['nyc'];
  $('where').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === 'all' ? !state.locs.length : state.locs.includes(b.dataset.v))));
}
$('where').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const v = b.dataset.v;
  state.locs = v === 'all' ? [] : state.locs.includes(v) ? state.locs.filter(x => x !== v) : [...state.locs, v];
  state.shown = PAGE; save(); setLocs(); render();
};
setLocs();
$('age').value = state.age;
$('fit').value = state.fit;
$('fit').addEventListener('change', e => { state.fit = e.target.value; state.shown = PAGE; save(); render(); });
$('age').addEventListener('change', e => { state.age = e.target.value; state.shown = PAGE; save(); render(); });
$('src').addEventListener('change', e => { state.src = e.target.value; state.shown = PAGE; save(); render(); });
let t;
$('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; save(); render(); }, 120); });
$('lvl').addEventListener('change', e => { state.lvl = e.target.value; state.shown = PAGE; save(); render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; state.shown = PAGE; save(); render(); });
$('more').addEventListener('click', () => { state.shown += PAGE; render(); });
$('list').innerHTML = '<li class="empty">Loading today’s jobs…</li>';
fetch('jobs.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = d; header(); render(); })
  .catch(() => { $('list').innerHTML = '<li class="empty">Could not load the job list. Reload the page; if it keeps failing, the daily update may not have run.</li>'; });
</script>
